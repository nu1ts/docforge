[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "docforge"
version = "0.1.0"
description = "AI-powered developer documentation generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "google-genai>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.scripts]
docforge = "docforge.cli:main"

[tool.setuptools.packages.find]
include = ["docforge*"]

[tool.setuptools.package-data]
docforge = ["templates/**/*"]
